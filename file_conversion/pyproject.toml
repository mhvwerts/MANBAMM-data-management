[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manbamm_converters"
dynamic = ["version"]
description = "Readers that convert proprietary scientific instrument file formats into open formats"
readme = "README.md"
requires-python = ">=3.9"
license = "CECILL-C"
license-files = ["LICENSE*"]
authors = [{ name = "Martinus H. V. Werts", email = "martinus.werts@univ-angers.fr" }]
keywords = ["spectroscopy", "spectrometer", "file format", "OceanOptics", "ProcSpec", "open data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
examples = ["matplotlib"]
test = ["pytest"]

[tool.setuptools.dynamic]
version = { attr = "manbamm_converters.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
